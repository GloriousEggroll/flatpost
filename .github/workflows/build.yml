name: Build and upload development artifacts

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  version:
    name: Describe
    uses: ./.github/workflows/build-flatpost-version.yml

  fedora42-build:
    name: Fedora 42 Build
    uses: ./.github/workflows/build-flatpost-f42.yml
    needs: version
    with:
      version: ${{ needs.version.outputs.version }}
      shasum: ${{ github.sha }}

  fedora43-build:
    name: Fedora 43 Build
    uses: ./.github/workflows/build-flatpost-f43.yml
    needs: version
    with:
      version: ${{ needs.version.outputs.version }}
      shasum: ${{ github.sha }}
